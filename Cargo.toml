[workspace]
members = [
  "apps/frontend",
  "apps/host-agent",
  "crates/build-support",
  "crates/bytecode-constants",
  "crates/builtin-scripts",
  "crates/dsl/dsl-core",
  "crates/dsl/dsl-wasm",
  "crates/dsl/firmware-exec",
  "firmware",
]
default-members = ["firmware"]
resolver = "2"

[profile.release.package.frontend]
opt-level = "z"
codegen-units = 1

[profile.release.package.host-agent]
strip = true
opt-level = "z"
codegen-units = 1

[patch.crates-io]
picoserve = { path = "crates/vendor/picoserve" }
