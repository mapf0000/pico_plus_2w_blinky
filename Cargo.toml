[package]
edition = "2024"
name = "pico_rust"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[[bin]]
name = "pico_rust"
path = "src/main.rs"
required-features = ["firmware"]

[dependencies]
cortex-m = { version = "0.7", optional = true }
cortex-m-rt = { version = "0.7", optional = true }

embassy-executor = { version = "0.9", optional = true, features = [
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-net = { version = "0.7", optional = true, features = [
  "defmt",
  "proto-ipv4",
  "medium-ethernet",
  "dhcpv4",          # because you're calling Config::dhcpv4(...)
  "tcp", "udp",      # if you’ll open sockets
  "dns"              # if you’ll resolve hostnames
] }
embassy-rp = { version = "0.8", optional = true, features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp235xb",
    "binary-info",
] }
embassy-time = { version = "0.5", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-usb = "0.5"
embassy-usb-logger = { version = "0.5", optional = true }
usbd-hid = "0.8.1"

defmt = { version = "1", optional = true }
defmt-rtt = { version = "1", optional = true }
panic-probe = { version = "1", optional = true, features = ["print-defmt"] }

static_cell = "2.1.0"
log = "0.4"
embassy-sync = "0.7"
embassy-futures = "0.1"
heapless = "0.9"
portable-atomic = { version = "1", features = ["critical-section"] }

cyw43 = { version = "0.5", optional = true, features = [
    "defmt",
    "firmware-logs",
] }
cyw43-pio = { version = "0.8", optional = true, features = [
    "defmt",
] }
leasehund = { version = "0.2", optional = true }
picoserve = { version = "0.16.0", features = ["embassy"] }
firmware-exec = { path = "dsl/firmware-exec" }
embassy-time-compat = { package = "embassy-time", version = "0.4", default-features = false }


[features]
psram = []
default = ["firmware", "psram"]
firmware = [
  "cortex-m",
  "cortex-m-rt",
  "embassy-executor",
  "embassy-net",
  "embassy-rp",
  "embassy-usb-logger",
  "defmt",
  "defmt-rtt",
  "panic-probe",
  "cyw43",
  "cyw43-pio",
  "leasehund",
]
## Enable USB to start automatically at boot (useful for debug runs)
usb_autostart = []

[workspace]
members = [
  "frontend",
  "build-support",
  #"dsl",
]

[profile.release.package.frontend]
opt-level = "z"
codegen-units = 1

[build-dependencies]
build-support = { path = "./build-support" }

[patch.crates-io]
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "de5dd10a5832b330465d93399b3a9cb761e24029" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", rev = "de5dd10a5832b330465d93399b3a9cb761e24029" }
embassy-hal-internal = { git = "https://github.com/embassy-rs/embassy.git", rev = "de5dd10a5832b330465d93399b3a9cb761e24029" }
embassy-net = { git = "https://github.com/embassy-rs/embassy.git", rev = "de5dd10a5832b330465d93399b3a9cb761e24029" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy.git", rev = "de5dd10a5832b330465d93399b3a9cb761e24029" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "de5dd10a5832b330465d93399b3a9cb761e24029" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "de5dd10a5832b330465d93399b3a9cb761e24029" }
embassy-time-driver = { git = "https://github.com/embassy-rs/embassy.git", rev = "de5dd10a5832b330465d93399b3a9cb761e24029" }
embassy-usb = { git = "https://github.com/embassy-rs/embassy.git", rev = "de5dd10a5832b330465d93399b3a9cb761e24029" }
embassy-usb-logger = { git = "https://github.com/embassy-rs/embassy.git", rev = "de5dd10a5832b330465d93399b3a9cb761e24029" }
embassy-net-driver = { git = "https://github.com/embassy-rs/embassy.git", rev = "de5dd10a5832b330465d93399b3a9cb761e24029" }
embassy-net-driver-channel = { git = "https://github.com/embassy-rs/embassy.git", rev = "de5dd10a5832b330465d93399b3a9cb761e24029" }
embassy-usb-driver = { git = "https://github.com/embassy-rs/embassy.git", rev = "de5dd10a5832b330465d93399b3a9cb761e24029" }
leasehund = { path = "third_party/leasehund" }
