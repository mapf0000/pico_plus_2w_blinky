[package]
name = "dsl-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dsl-core = { path = "../dsl-core", features = ["std"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
layout_win_en_gb = ["dsl-core/layout_win_en_gb"]
layout_win_pt_br = ["dsl-core/layout_win_pt_br"]
layout_win_de_de = ["dsl-core/layout_win_de_de"]
layout_mac_en_gb = ["dsl-core/layout_mac_en_gb"]
layout_mac_pt_br = ["dsl-core/layout_mac_pt_br"]
layout_mac_de_de = ["dsl-core/layout_mac_de_de"]
