# crates/firmware-exec/Cargo.toml
[package]
name = "firmware-exec"
version = "0.1.0"
edition = "2021"

[dependencies]
embassy-time = { version = "0.5", default-features = false }
embassy-usb = { version = "0.6", default-features = false, features = ["usbd-hid"] }
usbd-hid = { version = "0.10", default-features = false }

[features]
default = []
