[package]
name = "ble-session"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
noise-protocol = { version = "=0.2.1", default-features = false }
noise-rust-crypto = { version = "=0.6.2", default-features = false, features = ["use-chacha20poly1305", "use-sha2"] }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9.1", default-features = false }

[dev-dependencies]
ble-protocol = { path = "../ble-protocol" }
snow = { version = "0.10.0", default-features = false, features = ["default-resolver-crypto", "risky-raw-split"] }

