name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-check:
    name: Host checks (fmt + clippy + check)
    runs-on: ubuntu-latest
    env:
      # Skip Trunk + frontend embedding during host checks
      PICO_SKIP_FRONTEND: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (host)
        run: cargo clippy --no-default-features --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Cargo check (host linux)
        run: cargo check --no-default-features --target x86_64-unknown-linux-gnu

  embed-check:
    name: Embed frontend + check firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf, wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        run: cargo install trunk

      - name: Build frontend with Trunk (release)
        working-directory: frontend
        run: trunk build --release

      - name: Cargo check firmware target (runs build.rs, embeds assets)
        env:
          # Fail if the WASM exceeds this size (bytes)
          PICO_WASM_MAX_BYTES: "1400000"
        run: cargo check --features firmware --target thumbv8m.main-none-eabihf
