[package]
edition = "2024"
name = "pico_rust"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[[bin]]
name = "pico_rust"
path = "src/main.rs"
required-features = ["firmware"]

[dependencies]
cortex-m = { version = "0.7.9", optional = true }
cortex-m-rt = { version = "0.7.7", optional = true }

embassy-executor = { version = "0.10.0", optional = true, features = [
    "platform-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-net = { version = "0.9.1", optional = true, features = [
  "defmt",
  "proto-ipv4",
  "medium-ethernet",
  "dhcpv4",          # because you're calling Config::dhcpv4(...)
  "tcp", "udp",      # if you’ll open sockets
  "dns"              # if you’ll resolve hostnames
] }
embassy-rp = { version = "0.10.0", optional = true, features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp235xb",
    "binary-info",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-usb = "0.6.0"
embassy-usb-logger = { version = "0.6.0", optional = true }
usbd-hid = "0.10.2"

defmt = { version = "1.1.1", optional = true }
defmt-rtt = { version = "1.3.0", optional = true }
panic-probe = { version = "1.0.0", optional = true, features = ["print-defmt"] }

static_cell = "2.1.1"
log = "0.4.34"
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
heapless = "0.9.3"
portable-atomic = { version = "1.15.0", features = ["critical-section"] }
embedded-graphics = "0.8.2"

cyw43 = { version = "0.7.0", optional = true, features = [
    "defmt",
    "firmware-logs",
] }
cyw43-pio = { version = "0.10.0", optional = true, features = [
    "defmt",
] }
leasehund = { version = "0.6.0", optional = true }
picoserve = { version = "0.20.1", features = ["embassy", "ws"] }
firmware-exec = { path = "../crates/firmware-exec" }
bytecode-constants = { path = "../crates/bytecode-constants" }
transfer-protocol = { path = "../crates/transfer-protocol" }
script-protocol = { path = "../crates/script-protocol" }


embassy-sync-ble = { package = "embassy-sync", version = "0.7.2", optional = true }
ble-protocol = { path = "../crates/ble-protocol", optional = true }
trouble-host = { version = "=0.6.0", optional = true, default-features = false, features = ["peripheral", "gatt", "derive", "default-packet-pool", "default-packet-pool-mtu-27", "default-packet-pool-size-8", "defmt"] }

[features]
psram = []
# Read-only feasibility service. WLAN remains enabled.
ble = ["firmware", "cyw43/bluetooth", "dep:trouble-host", "dep:ble-protocol", "dep:embassy-sync-ble"]
default = ["firmware", "psram"]
firmware = [
  "cortex-m",
  "cortex-m-rt",
  "embassy-executor",
  "embassy-net",
  "embassy-rp",
  "embassy-usb-logger",
  "defmt",
  "defmt-rtt",
  "panic-probe",
  "cyw43",
  "cyw43-pio",
  "leasehund",
]
## Enable USB to start automatically at boot (useful for debug runs)
usb_autostart = []

[build-dependencies]
build-support = { path = "../crates/build-support" }
