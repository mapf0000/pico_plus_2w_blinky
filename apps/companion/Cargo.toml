[package]
name = "pico-companion"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
companion-core = { path = "../../crates/companion-core" }
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = [
  "accesskit", "default_fonts", "glow", "wayland", "x11",
] }
tokio = { version = "1.53.2", features = ["rt", "sync", "time", "macros"] }

btleplug = "0.13.4"
uuid = "1.23.0"
ble-protocol = { path = "../../crates/ble-protocol" }
ble-session = { path = "../../crates/ble-session" }
getrandom = "0.4.3"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
zeroize = "1.9.1"

script-protocol = { path = "../../crates/script-protocol" }

[features]
# Development-only native screenshot capture; not enabled in normal builds.
screenshot = ["eframe/__screenshot"]
