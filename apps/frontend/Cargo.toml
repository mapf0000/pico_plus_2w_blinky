[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2.126"
js-sys = "0.3"
gloo-net = "0.7"
gloo-timers = { version = "0.4", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2.3"
futures-channel = "0.3"
crc32fast = "1.5"
sha2 = "0.11"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "HtmlSelectElement",
  "HtmlElement",
  "HtmlAnchorElement",
  "BinaryType",
  "Blob",
  "Url",
  "WebSocket",
  "MessageEvent",
  "CloseEvent",
  "ErrorEvent",
  "Performance"
] }
wasm-bindgen-futures = "0.4.76"
dsl-core = { path = "../../crates/dsl/dsl-core" }
builtin-scripts = { path = "../../crates/builtin-scripts" }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["layout_mac_de_de"]
layout_win_en_gb = ["dsl-core/layout_win_en_gb"]
layout_win_pt_br = ["dsl-core/layout_win_pt_br"]
layout_win_de_de = ["dsl-core/layout_win_de_de"]
layout_mac_en_gb = ["dsl-core/layout_mac_en_gb"]
layout_mac_pt_br = ["dsl-core/layout_mac_pt_br"]
layout_mac_de_de = ["dsl-core/layout_mac_de_de"]
