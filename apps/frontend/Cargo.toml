[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew = { version = "0.23.0", features = ["csr"] }
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
gloo-net = "0.7.0"
gloo-timers = { version = "0.4.0", features = ["futures"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
percent-encoding = "2.3.2"
futures-channel = "0.3.34"
sha2 = "0.11.0"
web-sys = { version = "0.3.106", features = [
  "Window",
  "Document",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "HtmlSelectElement",
  "HtmlElement",
  "HtmlAnchorElement",
  "BinaryType",
  "Blob",
  "Url",
  "WebSocket",
  "MessageEvent",
  "CloseEvent",
  "ErrorEvent",
  "Performance"
  ,"Worker"
  ,"WorkerOptions"
  ,"WorkerType"
] }
wasm-bindgen-futures = "0.4.79"
keyboard-core = { path = "../../crates/keyboard-core" }
transfer-crypto = { path = "../../crates/transfer-crypto" }
transfer-protocol = { path = "../../crates/transfer-protocol" }
script-protocol = { path = "../../crates/script-protocol" }
zeroize = "1.9.1"

[dev-dependencies]
wasm-bindgen-test = "0.3.79"
