[package]
name = "host-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
hostname = "0.4.2"
serialport = "4.10.1"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-serial = "5.5.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.21"
sha2 = "0.11.0"
transfer-crypto = { path = "../../crates/transfer-crypto" }
transfer-protocol = { path = "../../crates/transfer-protocol" }
zeroize = "1.9.1"

[features]
test-port-fd = []

[dev-dependencies]
libc = "0.2.190"
