# .cargo/config.toml (workspace root)

[build]
# Default to the RP235x (Cortex-M33) target so `cargo run --release`
# cross-compiles firmware and uses the custom runner.
target = "thumbv8m.main-none-eabihf"

[target.thumbv8m.main-none-eabihf]
# Custom runner that flashes the board and captures logs
runner = "./scripts/pico-run"

# Cortex-M (embedded) rustflags only apply to the thumb target
rustflags = [
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "target-cpu=cortex-m33",
]

[env]
# defmt log level for firmware
DEFMT_LOG = "debug"
