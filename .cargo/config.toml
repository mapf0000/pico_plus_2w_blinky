# .cargo/config.toml (workspace root)

# Note: no default target here so host builds/tests use the host triple.
# The firmware crate sets its own default target in `firmware/.cargo/config.toml`.

[target.thumbv8m.main-none-eabihf]
# Custom runner that flashes the board and captures logs
runner = "./scripts/pico-run"
# Cortex-M (embedded) rustflags only apply to the thumb target
rustflags = [
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "target-cpu=cortex-m33",
]

# Use wasm-bindgen test runner for wasm32 test invocations
[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"
rustflags = [
    "--cfg",
    "getrandom_backend=\"wasm_js\"",
    "-C",
    "link-arg=--max-memory=134217728",
]

[env]
# defmt log level for firmware
DEFMT_LOG = "debug"
EMBASSY_USB_MAX_INTERFACE_COUNT = "8"
EMBASSY_USB_MAX_HANDLER_COUNT = "6"

[alias]
fw-deploy = "run -p pico_rust --release --target thumbv8m.main-none-eabihf"
