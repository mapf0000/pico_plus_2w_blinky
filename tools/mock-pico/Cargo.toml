[package]
name = "mock-pico"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
] }
transfer-protocol = { path = "../../crates/transfer-protocol" }
script-protocol = { path = "../../crates/script-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"
serialport = "4.10.1"
tokio-serial = "5.5.0"
