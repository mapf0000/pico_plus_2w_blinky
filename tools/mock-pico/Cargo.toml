[package]
name = "mock-pico"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
] }
transfer-protocol = { path = "../../crates/transfer-protocol" }
script-protocol = { path = "../../crates/script-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
serialport = "4.9"
tokio-serial = "5.5"
