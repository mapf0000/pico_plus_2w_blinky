[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2.103"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2.3"
futures-channel = "0.3"
web-sys = { version = "0.3", features = [
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "HtmlElement",
  "WebSocket",
  "MessageEvent",
  "CloseEvent",
  "ErrorEvent"
] }
wasm-bindgen-futures = "0.4.53"
dsl-core = { path = "../dsl/dsl-core" }
builtin-scripts = { path = "../builtin-scripts" }

[dev-dependencies]
wasm-bindgen-test = "0.3"
